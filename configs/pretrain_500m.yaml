# Mini-R1: 500M-Token Base Pretraining Production Configuration
# Frozen Architecture: 42.1M Parameter Decoder-Only Transformer

model:
  vocab_size: 8000
  max_seq_len: 512
  d_model: 512
  n_layers: 12
  n_heads: 8
  d_ff: 2048
  dropout: 0.0

training:
  target_tokens: 500000000
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  effective_batch_size: 32
  tokens_per_step: 16384
  
  # Optimization
  peak_lr: 0.0006
  min_lr: 0.00006
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0
  
  # Precision & Hardware
  precision: float16
  seed: 42
  
  # Evaluation & Checkpointing
  val_interval_steps: 500
  checkpoint_interval_steps: 1000
  log_interval_steps: 50
  retained_checkpoints: 3

data:
  train_manifest: data/pretrain/train_manifest.json
  val_manifest: data/pretrain/val_manifest.json
  source_mixture:
    cosmopedia-v2: 0.60
    fineweb-edu-dedup: 0.40
  format: uint16_binary_memmap
