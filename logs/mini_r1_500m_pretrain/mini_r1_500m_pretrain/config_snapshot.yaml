model:
  bias: false
  d_ff: 2048
  d_model: 512
  dropout: 0.0
  max_seq_len: 512
  n_heads: 8
  n_layers: 12
  tie_word_embeddings: true
  vocab_size: 8000
training:
  amp_dtype: float16
  checkpoint_interval_steps: 1000
  device: cuda
  gradient_accumulation_steps: 4
  log_interval_steps: 50
  max_grad_norm: 1.0
  val_interval_steps: 500
