model:
  bias: false
  d_ff: 64
  d_model: 32
  dropout: 0.0
  max_seq_len: 16
  n_heads: 2
  n_layers: 1
  tie_word_embeddings: true
  vocab_size: 100
training:
  amp_dtype: float16
  checkpoint_interval_steps: 20
  device: cpu
  gradient_accumulation_steps: 4
  log_interval_steps: 5
  max_grad_norm: 1.0
  val_interval_steps: 20
